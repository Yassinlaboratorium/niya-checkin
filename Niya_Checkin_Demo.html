<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niya Check-in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1c2647;--navy2:#2a3766;--deep:#0d1330;--blue:#3b82f6;--blue2:#60a5fa;--sky:#eaf2fe;
  --ink:#121829;--ink2:#3a4258;--mute:#7a8197;--line:#eceef3;--bg:#f6f7fb;--card:#fff;
  --ok:#10a36f;--okbg:#e6f7f0;--warn:#e08a00;--warnbg:#fff5e0;--bad:#e5484d;--badbg:#fdecec;
  --r:18px;--sh:0 1px 2px rgba(16,24,48,.04),0 4px 14px -6px rgba(16,24,48,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 15% -10%,#2a3a7a 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#1d3d7a 0%,transparent 55%),var(--deep);
  min-height:100vh;padding:34px 20px 40px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{display:block}

/* stage */
.intro{max-width:1000px;margin:0 auto 28px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.brandline{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#2563eb);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(59,130,246,.6)}
.intro h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.intro p{font-size:13.5px;color:#aab3d1;margin-top:3px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipbtn{font-size:12.5px;font-weight:600;color:#cdd4ec;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.chipbtn:hover{background:rgba(255,255,255,.12)}
.sw{display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px}
.sw button{font-size:13px;font-weight:600;color:#cdd4ec;padding:8px 16px;border-radius:999px}
.sw button.on{background:#fff;color:var(--navy)}

.stage{display:flex;justify-content:center;gap:56px;align-items:flex-start;max-width:1000px;margin:0 auto}
.dev{display:flex;flex-direction:column;align-items:center;gap:14px}
.dev .cap{color:#fff;text-align:center}
.dev .cap b{font-size:14px;font-weight:600;display:block}
.dev .cap span{font-size:12.5px;color:#93a0c8}

.phone{width:375px;height:780px;border-radius:54px;background:#0a0e1d;padding:11px;position:relative;
  box-shadow:0 0 0 1.5px #2b3352,0 40px 80px -24px rgba(0,0,0,.7),inset 0 0 0 1px #3a4366}
.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:108px;height:31px;border-radius:20px;background:#000;z-index:50}
.sbar{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-size:14.5px;font-weight:600;position:relative;z-index:40}
.sbar .ic{display:flex;gap:5px;align-items:center}
.app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.ov{position:absolute;inset:0;pointer-events:none;z-index:30}
.ov>*{pointer-events:auto}

.panel{margin-top:4px;width:100%;max-width:375px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;color:#cdd4ec;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel .seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:10px;padding:3px}
.panel .seg button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;color:#aab3d1}
.panel .seg button.on{background:#fff;color:var(--navy)}

@media (max-width:900px){
  body{padding:22px 14px 30px}
  .sw{display:inline-flex}
  .stage{gap:0}
  .stage[data-show="emp"] #d-adm,.stage[data-show="adm"] #d-emp{display:none}
  .intro{justify-content:center;text-align:center;flex-direction:column;align-items:center}
}
@media (max-width:430px){
  body{padding:14px 0 20px}
  .intro{flex-direction:row;justify-content:space-between;text-align:left;padding:0 16px;margin-bottom:14px;gap:10px}
  .intro p{display:none}.intro h1{font-size:18px}.mark{width:34px;height:34px}
  .ctrl{gap:6px}.chipbtn{padding:8px 10px;font-size:0}.chipbtn::before{content:"↺";font-size:15px}
  .sw button{padding:7px 11px;font-size:12px}
  .phone{width:100vw;height:calc(100svh - 170px);min-height:600px;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}.island{display:none}
  .sbar{height:34px;padding:0 20px}
  .panel{border-radius:0;max-width:none}
  .dev .cap{display:none}
}

/* ---------- app ui ---------- */
.top{padding:6px 20px 18px}
.top .r{display:flex;justify-content:space-between;align-items:center}
.top .hi{font-size:13px;color:var(--mute);font-weight:500}
.top h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.wrap{padding:0 16px 100px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px}
.pad{padding:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.eyebrow a{letter-spacing:0;text-transform:none;font-weight:600;color:var(--blue);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-mute{background:#f0f1f5;color:var(--mute)}.p-blue{background:var(--sky);color:var(--blue)}

/* shift */
.minimap{height:104px;border-radius:var(--r) var(--r) 0 0;overflow:hidden;position:relative;background:#e9edf4}
.shift .info{padding:14px 16px 16px}
.shift h3{font-size:17px;font-weight:700;letter-spacing:-.01em}
.shift .addr{font-size:13px;color:var(--mute);margin-top:2px}
.meta3{display:grid;grid-template-columns:1fr 1fr 1.4fr;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.meta3 span{display:block;font-size:11px;color:var(--mute);font-weight:500}
.meta3 b{font-size:14.5px;font-weight:600}

/* check button */
.cwrap{display:flex;flex-direction:column;align-items:center;padding:20px 0 8px}
.cbtn{width:158px;height:158px;border-radius:50%;position:relative;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 25%,#34d399,var(--ok) 60%);box-shadow:0 18px 40px -14px rgba(16,163,111,.8),inset 0 -6px 14px rgba(0,0,0,.12);transition:transform .12s}
.cbtn:active{transform:scale(.97)}
.cbtn::before,.cbtn::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(16,163,111,.35);animation:pulse 2.4s ease-out infinite}
.cbtn::after{animation-delay:1.2s}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
.cbtn .in{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:19px;font-weight:700}
.cbtn.busy{background:radial-gradient(circle at 30% 25%,#7fb2ff,var(--blue) 60%);box-shadow:0 18px 40px -14px rgba(59,130,246,.8)}
.cbtn.busy::before,.cbtn.busy::after{border-color:rgba(59,130,246,.35)}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.cnote{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-top:20px}

/* active */
.ring{width:190px;height:190px;position:relative;margin:18px auto 6px}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .l{font-size:12px;color:var(--mute);margin-top:2px}
.stat{display:flex;gap:12px;align-items:center}
.sico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat b{display:block;font-size:14.5px;font-weight:600}
.stat span{font-size:12.5px;color:var(--mute);line-height:1.4}
.btn-out{width:100%;height:56px;border-radius:16px;background:var(--navy);color:#fff;font-size:16px;font-weight:600;box-shadow:0 10px 24px -12px rgba(28,38,71,.8)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{font-size:12.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.day{width:46px;flex:none;text-align:center;background:var(--bg);border-radius:12px;padding:7px 0}
.day small{display:block;font-size:10px;color:var(--mute);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.day b{font-size:17px;font-weight:700}
.day.on{background:var(--navy);color:#fff}.day.on small{color:#aab3d1}

/* admin */
.ahead{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;padding:6px 20px 22px}
.ahead .hi{color:#9aa6cc}
.ahead h2{color:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.kp div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 12px}
.kp b{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em}
.kp span{font-size:11.5px;color:#aab3d1;font-weight:500}
.alert{margin:14px 0 4px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;gap:12px;border-left:4px solid var(--bad)}
.alert b{font-size:14px;font-weight:700;display:block}
.alert span{font-size:12.5px;color:var(--mute);display:block;margin-top:2px}
.alert .acts{display:flex;gap:8px;margin-top:10px}
.b{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:10px;background:var(--navy);color:#fff}
.b.g{background:var(--bg);color:var(--ink2)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:16px 0 10px;scrollbar-width:none}
.filters button{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:#fff;color:var(--ink2);box-shadow:var(--sh);white-space:nowrap}
.filters button.on{background:var(--navy);color:#fff}
.filters button i{font-style:normal;opacity:.6;margin-left:3px}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:7px}
.bar div{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--navy2),var(--blue))}
.big-btn{width:100%;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.big-btn.l{background:#fff;color:var(--navy);box-shadow:var(--sh)}
.new{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:#eaf7f1}100%{background:transparent}}

/* tabs */
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 14px 22px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:#a3a9ba}
.tabs button.on{color:var(--navy)}
.tabs .badge{position:absolute;margin-left:18px;margin-top:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,29,.45);display:flex;align-items:flex-end;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:10px 18px 30px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.grab{width:38px;height:5px;border-radius:3px;background:#dfe2ea;margin:0 auto 16px}
.sheet h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sheet p{font-size:13.5px;color:var(--mute);margin:6px 0 16px;line-height:1.45}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:14px;font-size:14px;font-weight:500;margin-bottom:8px}
.opt .o{width:20px;height:20px;border-radius:50%;border:2px solid #cfd3de}
.opt.on{border-color:var(--navy);background:#f5f7fc}.opt.on .o{border:6px solid var(--navy)}
.big-btn:disabled{opacity:.35}
.lnk{width:100%;padding:14px;font-size:14px;font-weight:600;color:var(--mute)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.kv div{background:var(--bg);border-radius:12px;padding:10px 12px}
.kv span{font-size:11px;color:var(--mute);display:block}
.kv b{font-size:14px}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;padding:13px 15px;border-radius:14px;display:flex;gap:10px;align-items:center;animation:up .25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.foot{max-width:1000px;margin:26px auto 0;text-align:center;font-size:12px;color:#7d89b3}
</style>
</head>
<body>

<header class="intro">
  <div class="brandline">
    <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><path d="M9 9.2l2.2 2.2L15.2 7.4"/></svg></div>
    <div><h1>Niya Check-in</h1><p>Inchecken op de werf, met locatiecontrole en live opvolging.</p></div>
  </div>
  <div class="ctrl">
    <div class="sw"><button id="sw-emp" class="on" onclick="show('emp')">Medewerker</button><button id="sw-adm" onclick="show('adm')">Zaakvoerder</button></div>
    <button class="chipbtn" onclick="resetAll()">↺ Demo opnieuw</button>
  </div>
</header>

<main class="stage" id="stage" data-show="emp">
  <section class="dev" id="d-emp">
    <div class="phone"><div class="screen"><div class="island"></div>
      <div class="sbar" id="sb-emp"></div><div class="app" id="app-emp"></div><div class="ov" id="ov-emp"></div>
    </div></div>
    <div class="panel"><span>Locatie simuleren</span><div class="seg" id="sim"></div></div>
    <div class="cap"><b>App van de medewerker</b><span>Op de gsm, zonder App Store</span></div>
  </section>
  <section class="dev" id="d-adm">
    <div class="phone"><div class="screen"><div class="island"></div>
      <div class="sbar" id="sb-adm" style="color:#fff"></div><div class="app" id="app-adm"></div><div class="ov" id="ov-adm"></div>
    </div></div>
    <div class="cap"><b>Overzicht van de zaakvoerder</b><span>Op gsm of computer, live bijgewerkt</span></div>
  </section>
</main>
<p class="foot">Demo met voorbeeldgegevens. Namen en locaties zijn fictief.</p>

<script>
const I={
 home:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>',
 cal:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 clock:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 pin:(s=23)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
 users:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5 6.5-5s5.7 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.5c2 .4 3.4 1.8 4 4.5"/></svg>',
 chart:'<svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/></svg>',
 check:(s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
 warn:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 8.5v4.5M12 16.5v.3"/><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>',
 bell:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg>',
 lock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
 phone:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>',
 dl:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
 plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};
const sbarIcons=c=>`<span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="${c}"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9.5 9.5 0 0113 0M4 7.2a6 6 0 018 0"/><circle cx="8" cy="10" r="1.1" fill="${c}" stroke="none"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="${c}" opacity=".45"/><rect x="2.2" y="2.2" width="16" height="7.6" rx="2" fill="${c}"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="${c}" opacity=".45"/></svg></span>`;

const fresh=()=>({
  show:'emp',empTab:'home',admTab:'live',filter:'all',inZone:true,ackLate:false,
  me:{state:'idle',flag:null},
  sheet:{emp:null,adm:null},reason:null,toast:{emp:null,adm:null},flashSa:false,
  staff:[
